[package]
name = "anydoc-mobile"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "anydoc_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
android-jni = ["dep:jni"]

[dependencies]
anydoc = { path = ".." }
liteparse = { version = "=2.17.0", default-features = false }
liteparse-pdfium-sys = "=1.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
url = "2"
jni = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
