// Expo evaluates this file through GroovyShell; locate the package from the
// resolved module entry rather than relying on the script's class location.
if (System.getenv('ANYDOC_BUILD_MODULE') == '1') return true
def result = providers.exec {
  ignoreExitValue = true
  commandLine 'node', '-e', 'const p=require.resolve("@bru02/anydoc/package.json"); const {spawnSync}=require("node:child_process"); const r=spawnSync(process.execPath,[require("node:path").join(require("node:path").dirname(p),"scripts/prebuilt-profile.mjs"),process.cwd()],{stdio:"inherit"});process.exit(r.status??1)'
}.result.get()
return result.exitValue == 0
