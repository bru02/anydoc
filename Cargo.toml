[workspace]
members = ["node", "python", "wasm", "native"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz", "native/third_party"]

[package]
name = "anydoc"
version = "0.2.4"
edition = "2024"
# Edition 2024 needs 1.85; zip raises it to 1.88.
rust-version = "1.88"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/examples/convert.rs", "/README.md", "/LICENSE"]

[dev-dependencies]
insta = "1"
sha2 = "0.11"

[dependencies]
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = "1.14.2"
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Native OCR hands the platform engine PDFium's 32-bit render without an RGB
# conversion. See native/third_party/README.md.
[patch.crates-io]
liteparse = { path = "native/third_party/liteparse" }
liteparse-pdfium = { path = "native/third_party/liteparse-pdfium" }

[profile.release]
lto = "thin"
strip = "symbols"
