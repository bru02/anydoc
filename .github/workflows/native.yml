name: Native prebuilds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        type: choice
        options: [both, ios, android]
        default: both
  push:
    tags: ['native-v*']
  pull_request:
    paths: ['native/**', 'ios/**', 'android/**', 'expo/**', 'src/**', 'Cargo.*', 'scripts/*native*', 'scripts/check-expo.mjs', 'scripts/vision-smoke.swift', 'scripts/licenses.hbs', 'about.toml', 'package.json', 'bun.lock', '.github/workflows/native.yml', '.github/workflows/pdfium.yml']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-host
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: cargo fmt --all --check
      - name: Native host tests against the pinned LiteParse PDFium fork
        run: bun scripts/build-native.mjs host
      - name: Test real Apple Vision fast and accurate OCR on generated text (no simulator)
        run: |
          mkdir -p native/dist
          swiftc -I native/include ios/NativeOCR.swift scripts/vision-smoke.swift -framework Vision -framework CoreGraphics -framework CoreText -o native/dist/vision-smoke
          native/dist/vision-smoke

  pdfium-ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: arm64
            environment: device
          - cpu: arm64
            environment: simulator
          - cpu: x64
            environment: simulator
    uses: ./.github/workflows/pdfium.yml
    with:
      os: ios
      cpu: ${{ matrix.cpu }}
      environment: ${{ matrix.environment }}

  pdfium-android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    strategy:
      fail-fast: false
      matrix:
        cpu: [arm64, arm, x64, x86]
    uses: ./.github/workflows/pdfium.yml
    with:
      os: android
      cpu: ${{ matrix.cpu }}

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    needs: [pdfium-ios, host]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-ios-all-targets-v2
          cache-workspace-crates: true
          cache-on-failure: true
      - run: cargo install cargo-about --version 0.9.3 --features cli --locked
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: cargo fmt --all --check
      - uses: actions/download-artifact@v7
        with:
          pattern: pdfium-ios-*
          path: native/vendor
      - name: Cross-compile device and simulator libraries (never boot a simulator)
        run: bun scripts/build-native.mjs ios
        env:
          ANYDOC_PDFIUM_FROM_CI: '1'
      - name: Compile the Swift Expo adapter against SDK 58 (device build only)
        run: bun scripts/check-expo.mjs ios
      - uses: actions/upload-artifact@v6
        with:
          name: anydoc-ios
          path: native/dist/anydoc-ios.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    needs: pdfium-android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: anydoc-android-all-targets-v2
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;27.1.12297006'
      - run: cargo install cargo-about --version 0.9.3 --features cli --locked
      - uses: actions/download-artifact@v7
        with:
          pattern: pdfium-android-*
          path: native/vendor
      - name: Prebuild JNI and PDFium for all four Android ABIs
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" ANYDOC_PDFIUM_FROM_CI=1 bun scripts/build-native.mjs android
      - name: Compile the Kotlin Expo adapter against SDK 58 (no emulator)
        run: bun scripts/check-expo.mjs android
      - uses: actions/upload-artifact@v6
        with:
          name: anydoc-android
          path: native/dist/anydoc-android.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [ios, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: anydoc-*
          path: artifacts
          merge-multiple: true
      - name: Publish immutable parser artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum anydoc-*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" anydoc-*.tar.gz SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes 'Precompiled AnyDoc Rust core, LiteParse 2.17.0 and its PDFium fork at chromium/8058. iOS device/simulator and four Android ABIs. Source paths only cross the JS bridge; optional native Apple Vision and ML Kit OCR support fast/accurate modes.'
