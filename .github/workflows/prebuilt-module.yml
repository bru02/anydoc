name: Complete Expo module prebuilts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated SDK 58 package to expo-v0.2.0
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: complete-module-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_USE_PRECOMPILED_MODULES: '1'
  CI: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: matrix.platform == 'ios'
        with:
          repository: expo/expo
          ref: e5514fbaca95d4467cfa0c4195c1b8af870a7180
          path: .ci/expo
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
        if: matrix.platform == 'android'
      - name: Fetch the SHA-verified Rust/PDFium core
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          ruby scripts/fetch-native.rb "$NATIVE_PLATFORM"
          mkdir -p "native/dist/$NATIVE_PLATFORM"
          if [ "$NATIVE_PLATFORM" = ios ]; then
            cp -R ios/Frameworks/. native/dist/ios/
          else
            mkdir -p native/dist/android/jniLibs
            cp -R android/src/main/jniLibs/. native/dist/android/jniLibs/
          fi
      - name: Compile and package the complete native module
        run: bun scripts/build-module.mjs '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v7
        with:
          name: full-${{ matrix.platform }}
          path: native/module-dist/full-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v7
        with:
          pattern: full-*
          merge-multiple: true
          path: native/module-dist
      - name: Assemble the installable package
        run: |
          tar -xzf native/module-dist/full-ios.tar.gz
          tar -xzf native/module-dist/full-android.tar.gz
          bun pm pack --filename native/module-dist/anydoc-expo-sdk58.tgz --ignore-scripts
          shasum -a 256 native/module-dist/anydoc-expo-sdk58.tgz > native/module-dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: sdk58-package
          path: |
            native/module-dist/anydoc-expo-sdk58.tgz
            native/module-dist/SHA256SUMS
          if-no-files-found: error

  consume:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
        if: matrix.platform == 'android'
      - uses: actions/download-artifact@v7
        with:
          name: sdk58-package
          path: native/module-dist
      - name: Compile a fresh app with the AnyDoc adapter sources removed
        run: bun scripts/check-prebuilt-module.mjs '${{ matrix.platform }}'

  publish:
    needs: consume
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: sdk58-package
          path: native/module-dist
      - name: Publish the validated package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create expo-v0.2.0 native/module-dist/anydoc-expo-sdk58.tgz native/module-dist/SHA256SUMS --target "$GITHUB_SHA" --title 'Complete Expo SDK 58 module' --notes 'Precompiled Swift and Kotlin adapters, Rust parser and patched PDFium. SDK profile: Expo 58.0.22, expo-modules-core 58.0.29, React Native 0.88.1. iOS Debug/Release device and simulator slices; Android all four ABIs. Consumer apps verified without AnyDoc adapter sources. No simulator or emulator boot required.'
